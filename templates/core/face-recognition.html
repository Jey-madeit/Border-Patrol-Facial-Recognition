<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition - Border Patrol System</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #10b981;
            --info-color: #3b82f6;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-color: #1f2937;
            --light-color: #f9fafb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .app-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .logo i {
            font-size: 2rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Main Content - Full Height Layout */
        .app-main {
            flex: 1;
            display: flex;
            padding: 0.75rem;
            gap: 0.75rem;
            height: calc(100vh - 80px);
            max-height: calc(100vh - 80px);
            overflow: hidden;
        }

        /* Left Panel - Camera */
        .camera-panel {
            width: 60%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .camera-container {
            height: calc(100vh - 400px);
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .face-frame {
            position: absolute;
            border: 3px solid var(--success-color);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .face-frame.active {
            opacity: 1;
            animation: faceDetected 0.5s ease;
        }

        @keyframes faceDetected {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .capture-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .capture-indicator.active {
            opacity: 1;
            animation: capturePulse 1s ease;
        }

        @keyframes capturePulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .camera-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.25rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Right Panel - Controls and Results */
        .control-panel {
            width: 40%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }

        .status-icon i {
            font-size: 1.2rem;
            color: var(--success-color);
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
        }

        .result-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .welcome-message {
            text-align: center;
            color: white;
            padding: 0.5rem 0;
        }

        .welcome-message i {
            font-size: 2rem;
            color: var(--info-color);
            margin-bottom: 0.5rem;
        }

        .welcome-message h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .welcome-message p {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Analyzing Animation */
        .analyzing-animation {
            display: none;
            text-align: center;
            color: white;
            padding: 2rem 0;
        }

        .analyzing-animation.active {
            display: block;
        }

        .analyzing-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid var(--info-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .analyzing-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .analyzing-subtext {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Face Match Results */
        .face-match-result {
            display: none;
            color: white;
        }

        .face-match-result.active {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        /* Force visibility for debugging */
        .face-match-result[style*="display: block"] {
            display: block !important;
            visibility: visible !important;
        }

        .match-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .match-icon {
            width: 60px;
            height: 60px;
            background: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-icon i {
            font-size: 2rem;
            color: white;
        }

        .match-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .match-details {
            display: grid;
            gap: 0.25rem;
            max-height: 120px;
            overflow-y: auto;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.25rem 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .detail-label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .detail-value {
            font-weight: 600;
        }

        .confidence-bar {
            width: 100px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: var(--success-color);
            transition: width 0.3s ease;
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            min-width: 50px;
            min-height: 50px;
        }

        .btn i {
            font-size: 1.2rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .capture-btn {
            min-width: 50px;
            min-height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        /* Notifications */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }

        .notification {
            padding: 1rem 1.5rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
        }

        .notification.success {
            background: var(--success-color);
            color: white;
        }

        .notification.error {
            background: var(--danger-color);
            color: white;
        }

        .notification.info {
            background: var(--info-color);
            color: white;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .control-panel {
                width: 350px;
            }
        }

        @media (max-width: 768px) {
            .app-main {
                flex-direction: column;
                height: auto;
            }
            
            .control-panel {
                width: 100%;
            }
            
            .camera-panel {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <span>Border Patrol - Face Recognition</span>
            </div>
            <div class="header-actions">
                <button id="themeBtn" class="btn btn-secondary">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="/api/officer-dashboard/" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Left Panel - Camera -->
            <div class="camera-panel">
                <div class="camera-container">
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="faceFrame" class="face-frame"></canvas>
                    <div id="captureIndicator" class="capture-indicator">
                        <i class="fas fa-camera"></i>
                    </div>
                </div>
                
                <!-- Camera Controls -->
                <div class="camera-controls">
                    <button id="startCameraBtn" class="btn btn-success" title="Start Camera" style="display: none;">
                        <i class="fas fa-video"></i>
                    </button>
                    <button id="switchBtn" class="btn btn-secondary" title="Switch Camera">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button id="captureBtn" class="btn btn-primary capture-btn" title="Capture Image">
                        <i class="fas fa-camera"></i>
                    </button>
                    <button id="clearBtn" class="btn btn-danger" title="Clear Results">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Right Panel - Controls and Results -->
            <div class="control-panel">
                <!-- Status Card -->
                <div class="status-card">
                    <div class="status-icon" id="statusIcon">
                        <i class="fas fa-video"></i>
                    </div>
                    <div class="status-text" id="statusText">Camera ready</div>
                </div>

                <!-- Result Card -->
                <div class="result-card" id="resultContent">
                    <!-- Welcome Message -->
                    <div class="welcome-message" id="welcomeMessage">
                        <i class="fas fa-face-smile"></i>
                        <h3>Face Recognition Ready</h3>
                        <p>Capture an image to begin face recognition</p>
                    </div>

                    <!-- Analyzing Animation -->
                    <div class="analyzing-animation" id="analyzingAnimation">
                        <div class="analyzing-spinner"></div>
                        <div class="analyzing-text">Analyzing Face...</div>
                        <div class="analyzing-subtext">Processing image data</div>
                    </div>

                    <!-- Face Match Results -->
                    <div class="face-match-result" id="faceMatchResult">
                        <div class="match-header">
                            <div class="match-icon">
                                <i class="fas fa-user-check"></i>
                            </div>
                            <div class="match-title">Face Recognition Results</div>
                        </div>
                        <div class="match-details" id="matchDetails">
                            <!-- Details will be populated by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button id="recognizeBtn" class="btn btn-success" disabled>
                        <i class="fas fa-search"></i>
                        Recognize Face
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notificationContainer" class="notification-container"></div>

    <script src="{% static 'core/js/app.js' %}"></script>
</body>
</html>
