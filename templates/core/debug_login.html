<!DOCTYPE html>
<html>
<head>
    <title>Debug Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 200px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin: 20px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Debug Login Test</h1>
    
    <form id="debugForm">
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="username" value="ADMIN029">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="AdminSecure123!">
        </div>
        <button type="submit">Test Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('debugForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Testing...';
            resultDiv.className = 'result';
            
            console.log('Sending credentials:', { username, password });
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/token/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = '✅ SUCCESS! Token received: ' + data.access.substring(0, 50) + '...';
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.innerHTML = '❌ FAILED: ' + JSON.stringify(data);
                    resultDiv.className = 'result error';
                }
                
            } catch (error) {
                resultDiv.innerHTML = '❌ ERROR: ' + error.message;
                resultDiv.className = 'result error';
            }
        });
    </script>
</body>
</html>
