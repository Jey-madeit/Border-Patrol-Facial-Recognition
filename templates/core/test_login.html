<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Border Patrol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Border Patrol - Test Login</h1>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="role">Role:</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="admin">Administrator</option>
                <option value="officer">Officer</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required>
        </div>
        
        <button type="submit">Test Login</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Testing login...';
            resultDiv.className = 'result';
            
            try {
                // Step 1: Get token
                console.log('Step 1: Getting token...');
                console.log('Sending credentials:', { username, password });
                
                const requestBody = JSON.stringify({
                    username: username,
                    password: password
                });
                console.log('Request body:', requestBody);
                
                const tokenResponse = await fetch('http://127.0.0.1:8000/api/token/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: requestBody
                });
                
                if (!tokenResponse.ok) {
                    const errorText = await tokenResponse.text();
                    console.error('Token request failed:', tokenResponse.status, errorText);
                    throw new Error(`Token request failed: ${tokenResponse.status} - ${errorText}`);
                }
                
                const tokenData = await tokenResponse.json();
                console.log('Token received:', tokenData);
                
                // Step 2: Get profile
                console.log('Step 2: Getting profile...');
                const profileResponse = await fetch('http://127.0.0.1:8000/api/profile/', {
                    headers: {
                        'Authorization': `Bearer ${tokenData.access}`
                    }
                });
                
                if (!profileResponse.ok) {
                    throw new Error(`Profile request failed: ${profileResponse.status}`);
                }
                
                const profileData = await profileResponse.json();
                console.log('Profile received:', profileData);
                
                const userProfile = profileData.user;
                
                // Step 3: Check role
                console.log('Step 3: Checking role...');
                console.log('User role:', userProfile.role);
                console.log('Selected role:', role);
                
                if (userProfile.role !== role) {
                    resultDiv.innerHTML = `❌ Role mismatch!\nUser role: ${userProfile.role}\nSelected role: ${role}`;
                    resultDiv.className = 'result error';
                } else {
                    resultDiv.innerHTML = `✅ Login successful!\n\nUser: ${userProfile.first_name} ${userProfile.last_name}\nRole: ${userProfile.role}\nBadge ID: ${userProfile.badge_id}`;
                    resultDiv.className = 'result success';
                }
                
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `❌ Login failed: ${error.message}`;
                resultDiv.className = 'result error';
            }
        });
    </script>
</body>
</html>
